name: First Glance · Daily Refresh
on:
  # ── Every weekday at 06:00 UTC = 07:00 CET (08:00 CEST in summer) ──
  schedule:
    - cron: "0 6 * * 1-5"
  # ── Allow manual trigger from GitHub Actions UI ──
  workflow_dispatch:

permissions:
  contents: write # needed to commit index.html back to the repo

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ── 1. Check out the repo ──────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Set up Python ───────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── 3. Install dependencies ────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Generate dashboard ──────────────────────────────────────────
      - name: Generate index.html
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: python generate.py

      # ── 5. Commit and push ─────────────────────────────────────────────
      - name: Commit dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: refresh dashboard $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
